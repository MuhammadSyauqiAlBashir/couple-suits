{% extends "base.html" %}
{% block main %}
<div class="wrap auth">
  <h1 class="page-title">{{ t('a.register') }}</h1>
  <p class="muted">{{ t('a.why') }}</p>
  <form method="post" action="/account/register" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>{{ t('a.name') }}</span><input name="name" autocomplete="name" required maxlength="120" value="{{ form.name or '' }}"></label>
    <label class="field"><span>{{ t('a.email') }}</span><input name="email" type="email" autocomplete="email" required maxlength="200" value="{{ form.email or '' }}"></label>
    <label class="field"><span>{{ t('a.password_new') }}</span><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
    <label class="field"><span>{{ t('a.phone') }}</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" value="{{ form.phone or '' }}"></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="check"><input type="checkbox" name="marketing" value="1"{{ ' checked' if form.marketing }}> {{ t('a.marketing') }}</label>
    <label class="check"><input type="checkbox" name="agree" value="1" required> {% if privacy %}{{ tl('a.agree', '/page/' ~ privacy.slug, 'co.privacy_link') }}{% else %}{{ t('a.agree', link=t('co.privacy_link')) }}{% endif %}</label>
    {% if error %}<p class="form-msg" role="alert">{{ error }}</p>{% endif %}
    <button class="btn primary wide" type="submit">{{ t('a.register') }}</button>
  </form>
  <hr>
  <p>{{ t('a.have_account') }} <a href="/account/login?next={{ next|urlencode }}">{{ t('a.login') }}</a></p>
</div>
{% endblock %}
